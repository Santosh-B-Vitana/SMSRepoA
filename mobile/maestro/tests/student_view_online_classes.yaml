appId: com.vitana.sms
---
# ────────────────────────────────────────────────────────────
# Online Classes · Student views upcoming and today's classes
#
# Precondition:
#   - Student is already logged in
#   - online_classes module is enabled for the demo school
#   - At least one class is scheduled (from teacher E2E or seeded data)
#
# Flow:
#   More menu → Online Classes → assert Today / Upcoming sections →
#   Tap a class → assert detail screen → go back
# ────────────────────────────────────────────────────────────

- launchApp:
    clearState: false

# ── Navigate to More tab ──────────────────────────────────────
- tapOn:
    text: "More"

- assertVisible: "More"

# ── Open Online Classes ───────────────────────────────────────
- tapOn:
    text: "Online Classes"

- assertVisible: "Online Classes"

# ── Assert the two section headers are visible ────────────────
- assertVisible: "TODAY"

- assertVisible: "UPCOMING"

# ── If a live class banner is showing, verify it ──────────────
# (Optional check — only asserted if element is present)
# - assertVisible:
#     text: "is live now!"
#     optional: true

# ── If there's an upcoming class card, tap into it ────────────
# We try to tap the first class card. The element text is the class title.
# In a fresh demo school, a seeded class might not exist — the test
# gracefully passes if no card is available (EmptyState is shown instead).
- runFlow:
    when:
      visible:
        text: "UPCOMING"
    commands:
      - scrollDown

# ── Verify page is usable (no crash) ─────────────────────────
- assertVisible: "Online Classes"

# ── Pull-to-refresh ───────────────────────────────────────────
- scroll:
    direction: DOWN
    speed: slow
    duration: 300

- scroll:
    direction: UP
    speed: slow
    duration: 1000

- assertVisible: "Online Classes"
