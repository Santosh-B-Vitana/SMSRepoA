name: Mobile PR Preview Build

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'packages/**'

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @vitana/shared-types build
          pnpm --filter @vitana/shared-utils build

      - name: Lint
        run: pnpm --filter @vitana/mobile lint

      - name: TypeScript check
        run: pnpm --filter @vitana/mobile typecheck

      - name: Tests
        run: pnpm --filter @vitana/shared-utils test --ci && pnpm --filter @vitana/mobile test --ci

  preview-build:
    name: EAS Preview Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: mobile

      - name: Build preview (Android APK + iOS)
        run: eas build --platform all --profile preview --non-interactive
        working-directory: mobile

      - name: Comment build links on PR
        uses: expo/expo-github-action/preview-comment@v8
        with:
          channel: preview
