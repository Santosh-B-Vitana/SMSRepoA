name: Mobile — Staging Build

on:
  push:
    branches:
      - develop
    paths:
      - 'mobile/**'
      - 'packages/**'

jobs:
  checks:
    uses: ./.github/workflows/mobile-checks.yml
    secrets: inherit

  staging-build:
    name: EAS Staging Build
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: mobile

      - name: Build shared packages
        run: |
          pnpm --filter @vitana/shared-types build
          pnpm --filter @vitana/shared-utils build

      - name: EAS Staging Build (both platforms)
        run: |
          eas build \
            --platform all \
            --profile staging \
            --non-interactive \
            --auto-submit
        working-directory: mobile
        env:
          SCHOOL_ID: vitana
          BUILD_NUMBER: ${{ needs.checks.outputs.build_number }}
          EXPO_APPLE_ID: ops@vitanasms.com

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1.27
        with:
          channel-id: 'mobile-builds'
          slack-message: |
            *Mobile Staging Build* ${{ job.status == 'success' && '✅' || '❌' }}
            Branch: `develop`
            Commit: `${{ github.sha && github.sha || '' }}`
            Build: #${{ needs.checks.outputs.build_number }}
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
